<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Система задач</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Система управления задачами</h1>

    <div id="error" style="display:none;color:red;margin:10px 0;"></div>

    <div class="form-group">
      <input type="text" id="taskTitle" placeholder="Новая задача" />
      <select title="van gog" id="categorySelect"></select>
      <button id="addTaskBtn">Добавить</button>
    </div>

    <h2>Задачи</h2>
    <div id="tasksList">Загрузка...</div>

    <h2>Статистика по категориям</h2>
    <div id="stats" class="stats">Загрузка...</div>

    <h2>Скачать отчёт</h2>
    <div class="download-btns">
      <button onclick="downloadReport('json')">JSON</button>
      <button onclick="downloadReport('xml')">XML</button>
      <button onclick="downloadReport('html')">HTML</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
